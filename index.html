<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>明日の服装</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
            background-color: #000000;
            color: #f5f5f7;
            -webkit-tap-highlight-color: transparent;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .safe-area-top {
            padding-top: env(safe-area-inset-top, 16px);
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .text-wrap-optimal {
            word-break: auto-phrase;
            overflow-wrap: anywhere;
            line-break: strict;
        }

        .ios-btn:active {
            transform: scale(0.97);
            filter: brightness(0.85);
        }

        .ios-loader {
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #0a84ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-180.png">
</head>
<body class="min-h-screen bg-black flex flex-col justify-between p-4 safe-area-top safe-area-bottom selection:bg-blue-600 selection:text-white">

    <div class="w-full max-w-sm mx-auto flex-1 flex flex-col justify-start space-y-4">
        
        <!-- iOS Style Header -->
        <header class="pt-3 pb-1 text-center relative">
            <button onclick="toggleSettingsModal()" class="absolute right-0 top-3 text-[#8e8e93] hover:text-white p-2 text-xl" title="APIキー設定（任意）">
                ⚙️
            </button>
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#1c1c1e] border border-[#2c2c2e] shadow-inner mb-3">
                <span class="text-3xl select-none">🧥</span>
            </div>
            <h1 class="text-[20px] font-bold tracking-tight text-white flex items-center justify-center gap-1.5">
                明日の服装
            </h1>
            <p id="headerSubtitle" class="text-[14px] text-[#8e8e93] mt-1 text-wrap-optimal font-normal">
                指定地域の気象データから最適な服装を判定
            </p>
        </header>

        <!-- Location Input Section -->
        <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-2xl p-3 shadow-xl space-y-2">
            <div class="flex items-center justify-between px-1">
                <label for="locationInput" class="text-[13px] font-medium text-[#8e8e93] flex items-center gap-1.5">
                    <span>📍</span>
                    <span>登録場所の管理</span>
                </label>
                <span id="saveStatus" class="text-[12px] text-[#30d158] font-medium transition-opacity opacity-0">追加完了</span>
            </div>
            
            <!-- 追加フォーム -->
            <div class="flex items-center gap-2">
                <input 
                    type="text" 
                    id="locationInput" 
                    placeholder="新しい場所（例: 大阪市、横浜市、新宿）" 
                    class="flex-1 bg-[#2c2c2e]/70 border border-[#3a3a3c] focus:border-[#0a84ff] text-white text-[14px] rounded-xl px-3 py-1.5 outline-none transition-colors duration-150 placeholder-[#636366]"
                    onkeydown="if(event.key === 'Enter') handleAddLocation()"
                >
                <button 
                    type="button" 
                    onclick="handleAddLocation()" 
                    class="ios-btn bg-[#0a84ff] hover:bg-[#0071e3] active:scale-95 text-white font-semibold text-[13px] px-3.5 py-1.5 rounded-xl shrink-0 transition-all flex items-center gap-1">
                    <span>＋ 追加</span>
                </button>
            </div>

            <!-- 登録場所リスト -->
            <div class="pt-0.5">
                <div class="text-[12px] text-[#8e8e93] mb-1.5 px-1 flex items-center justify-between">
                    <span>タップして切り替え：</span>
                    <span id="locationCount" class="text-[11px] text-[#636366]">0件</span>
                </div>
                <div id="locationList" class="space-y-1.5 max-h-36 overflow-y-auto pr-0.5">
                    <!-- JavaScriptで動的生成 -->
                </div>
            </div>
        </div>

        <!-- Action Section -->
        <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-2xl p-3.5 shadow-2xl backdrop-blur-md">
            <button 
                id="checkBtn" 
                onclick="getRecommendation()" 
                class="ios-btn w-full bg-[#0a84ff] hover:bg-[#0071e3] text-white font-semibold text-[16px] h-12 rounded-xl shadow-lg transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer touch-manipulation">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
                </svg>
                <span>明日の天気</span>
            </button>

            <!-- Loading State -->
            <div id="loading" class="hidden py-6 flex flex-col items-center justify-center">
                <div class="ios-loader w-8 h-8 mb-3"></div>
                <p id="loadingText" class="text-[14px] font-medium text-[#8e8e93] text-wrap-optimal animate-pulse text-center">
                    気象データを取得・解析中...
                </p>
            </div>
        </div>

        <!-- Fullscreen Result View -->
        <div id="resultBox" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex flex-col safe-area-top safe-area-bottom">
            <div class="flex items-center justify-between px-5 py-4 border-b border-[#2c2c2e] bg-[#1c1c1e]/80 backdrop-blur-md">
                <button onclick="closeResult()" class="ios-btn flex items-center gap-1.5 text-[#0a84ff] font-semibold text-[16px] py-1 px-2 -ml-2 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span>戻る</span>
                </button>
                <div class="flex items-center gap-2">
                    <span id="resultLocationBadge" class="text-[14px] bg-[#0a84ff]/20 text-[#0a84ff] border border-[#0a84ff]/30 px-3 py-1 rounded-full font-medium">東京都品川区</span>
                </div>
            </div>

            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 max-w-md w-full mx-auto">
                <div class="text-center pt-2 pb-1">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-[#1c1c1e] border border-[#2c2c2e] mb-2 shadow-inner">
                        <span id="resultWeatherEmoji" class="text-2xl">🌤</span>
                    </div>
                    <h2 id="resultMainTitle" class="text-[20px] font-bold text-white tracking-tight">明日の東京都品川区の天気</h2>
                </div>

                <!-- Forecast Section -->
                <div class="bg-[#1c1c1e] rounded-3xl p-5 border border-[#2c2c2e] shadow-xl">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-base">🌤</span>
                        <h3 class="text-[14px] font-semibold text-[#8e8e93] tracking-wider uppercase">予報</h3>
                    </div>
                    <div id="forecastSection" class="text-[15px] sm:text-[16px] font-medium text-white leading-relaxed text-wrap-optimal whitespace-pre-line space-y-1"></div>
                </div>

                <!-- Outfit Section -->
                <div class="bg-[#0a84ff]/15 rounded-3xl p-5 border border-[#0a84ff]/40 shadow-2xl shadow-blue-950/20">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-base">👔</span>
                        <h3 class="text-[14px] font-bold text-[#0a84ff] tracking-wider uppercase">服装</h3>
                    </div>
                    <div id="outfitSection" class="text-[16px] font-bold text-[#f5f5f7] leading-relaxed text-wrap-optimal whitespace-pre-line"></div>
                </div>

                <!-- Advice Section -->
                <div class="bg-[#1c1c1e] rounded-3xl p-4 border border-[#2c2c2e] shadow-lg">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-base">💡</span>
                        <h3 class="text-[14px] font-semibold text-[#8e8e93]">解説</h3>
                    </div>
                    <div id="adviceSection" class="text-[14px] text-[#aeaeb2] leading-relaxed text-wrap-optimal whitespace-pre-line"></div>
                </div>

                <!-- Bottom Back Button -->
                <div class="pt-2 pb-6">
                    <button onclick="closeResult()" class="ios-btn w-full bg-[#2c2c2e] hover:bg-[#3a3a3c] text-white font-medium text-[15px] h-12 rounded-2xl border border-[#3a3a3c] transition-all flex items-center justify-center">
                        閉じて戻る
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings Modal (Optional Gemini API Key) -->
        <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-[17px] font-bold text-white">⚙️ API詳細設定（任意）</h3>
                    <button onclick="toggleSettingsModal()" class="text-[#8e8e93] text-lg">✕</button>
                </div>
                <p class="text-[13px] text-[#8e8e93] leading-relaxed">
                    標準状態で登録不要の気象APIを使用しているため、設定しなくてもiPhoneやWebでそのままご利用いただけます。
                </p>
                <div>
                    <label class="text-[12px] text-[#8e8e93] mb-1 block">Gemini APIキー（AI高度解説用）</label>
                    <input 
                        type="password" 
                        id="userApiKey" 
                        placeholder="AI Studioのキー（空欄でOK）"
                        class="w-full bg-[#2c2c2e] border border-[#3a3a3c] text-white text-[13px] rounded-xl px-3 py-2 outline-none focus:border-[#0a84ff]"
                    >
                </div>
                <div class="flex gap-2">
                    <button onclick="saveApiKeySettings()" class="flex-1 bg-[#0a84ff] text-white py-2 rounded-xl text-[14px] font-semibold">保存する</button>
                    <button onclick="toggleSettingsModal()" class="bg-[#2c2c2e] text-[#aeaeb2] px-4 py-2 rounded-xl text-[14px]">キャンセル</button>
                </div>
            </div>
        </div>

        <!-- Error Card -->
        <div id="errorBox" class="hidden bg-[#2c1517] border border-[#ff453a]/30 rounded-2xl p-4 text-[14px] text-[#ff453a] leading-relaxed text-wrap-optimal">
            <!-- Dynamic error message -->
        </div>

    </div>

    <!-- Minimal Footer -->
    <footer class="text-center py-2">
        <p class="text-[14px] text-[#636366]">気象庁公式データ・ウェザーニュース基準連動</p>
    </footer>

    <script>
        const STORAGE_KEY_LIST = 'weather_checker_saved_locations_list';
        const STORAGE_KEY_ACTIVE = 'weather_checker_active_location';
        const DEFAULT_LOCATIONS = ['東京都品川区', '横浜市中区', '大阪市北区'];

        // 気象庁(JMA) 府県予報区コードマッピング (主要地域)
        const PREFECTURE_CODES = {
            '東京': '130000', '品川': '130000', '新宿': '130000', '渋谷': '130000', '千代田': '130000',
            '神奈川': '140000', '横浜': '140000', '川崎': '140000',
            '大阪': '270000', '北区': '270000', '梅田': '270000', '難波': '270000',
            '愛知': '230000', '名古屋': '230000',
            '北海道': '016000', '札幌': '016000',
            '福岡': '400000', '博多': '400000',
            '京都': '260000', '兵庫': '280000', '神戸': '280000',
            '宮城': '040000', '仙台': '040000',
            '広島': '340000', '沖縄': '471000', '那覇': '471000',
            '千葉': '120000', '埼玉': '110000', '茨城': '080000', '栃木': '090000', '群馬': '100000',
            '静岡': '220000', '新潟': '150000', '長野': '200000', '熊本': '430000'
        };

        // 主要地点の緯度経度（体感温度・風速等の精緻な気象補正用）
        const LOCATION_COORDS = {
            '東京': { lat: 35.6895, lon: 139.6917 },
            '品川': { lat: 35.6092, lon: 139.7302 },
            '横浜': { lat: 35.4437, lon: 139.6380 },
            '大阪': { lat: 34.6937, lon: 135.5023 },
            '名古屋': { lat: 35.1815, lon: 136.9066 },
            '札幌': { lat: 43.0618, lon: 141.3545 },
            '福岡': { lat: 33.5904, lon: 130.4017 },
            '京都': { lat: 35.0116, lon: 135.7681 },
            '神戸': { lat: 34.6901, lon: 135.1955 }
        };

        let locations = [];
        let activeLocation = '東京都品川区';

        window.addEventListener('DOMContentLoaded', () => {
            loadLocations();
            renderLocations();
        });

        function loadLocations() {
            const savedListJson = localStorage.getItem(STORAGE_KEY_LIST);
            if (savedListJson) {
                try {
                    locations = JSON.parse(savedListJson);
                } catch (e) {
                    locations = [...DEFAULT_LOCATIONS];
                }
            } else {
                locations = [...DEFAULT_LOCATIONS];
                saveLocationsToStorage();
            }

            if (!Array.isArray(locations) || locations.length === 0) {
                locations = ['東京都品川区'];
            }

            const savedActive = localStorage.getItem(STORAGE_KEY_ACTIVE);
            if (savedActive && locations.includes(savedActive)) {
                activeLocation = savedActive;
            } else {
                activeLocation = locations[0];
                localStorage.setItem(STORAGE_KEY_ACTIVE, activeLocation);
            }
        }

        function saveLocationsToStorage() {
            localStorage.setItem(STORAGE_KEY_LIST, JSON.stringify(locations));
            localStorage.setItem(STORAGE_KEY_ACTIVE, activeLocation);
        }

        function renderLocations() {
            const listEl = document.getElementById('locationList');
            const countEl = document.getElementById('locationCount');
            if (!listEl) return;

            if (countEl) countEl.innerText = `${locations.length}件登録中`;

            listEl.innerHTML = '';
            locations.forEach((loc) => {
                const isActive = (loc === activeLocation);
                
                const item = document.createElement('div');
                item.className = `flex items-center justify-between px-3 py-1.5 rounded-xl border transition-all ${
                    isActive 
                        ? 'bg-[#0a84ff]/20 border-[#0a84ff]/60 text-white shadow-sm' 
                        : 'bg-[#2c2c2e]/60 border-[#3a3a3c] text-[#aeaeb2] hover:bg-[#2c2c2e]'
                }`;

                const textBtn = document.createElement('button');
                textBtn.type = 'button';
                textBtn.className = 'flex-1 text-left flex items-center gap-2 text-[13px] font-medium outline-none truncate';
                textBtn.innerHTML = `
                    <span class="${isActive ? 'text-[#0a84ff]' : 'text-transparent'} text-xs select-none">✓</span>
                    <span class="truncate ${isActive ? 'font-semibold text-white' : ''}">${escapeHtml(loc)}</span>
                `;
                textBtn.onclick = () => selectLocation(loc);

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'ios-btn text-[#8e8e93] hover:text-[#ff453a] active:text-[#ff453a] p-1 ml-2 rounded-lg text-[12px] transition-colors';
                delBtn.setAttribute('aria-label', `${loc}を削除`);
                delBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                `;
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    handleDeleteLocation(loc);
                };

                item.appendChild(textBtn);
                item.appendChild(delBtn);
                listEl.appendChild(item);
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function selectLocation(loc) {
            activeLocation = loc;
            saveLocationsToStorage();
            renderLocations();
        }

        function handleAddLocation() {
            const input = document.getElementById('locationInput');
            const status = document.getElementById('saveStatus');
            const val = input?.value.trim();

            if (!val) return;

            if (!locations.includes(val)) {
                locations.unshift(val);
                activeLocation = val;
                saveLocationsToStorage();
                renderLocations();

                if (status) {
                    status.innerText = '追加完了';
                    status.classList.remove('opacity-0');
                    setTimeout(() => status.classList.add('opacity-0'), 1800);
                }
            } else {
                selectLocation(val);
            }

            if (input) input.value = '';
        }

        function handleDeleteLocation(locToDelete) {
            if (locations.length <= 1) {
                const status = document.getElementById('saveStatus');
                if (status) {
                    status.innerText = '最後の1件は削除できません';
                    status.classList.remove('opacity-0');
                    setTimeout(() => status.classList.add('opacity-0'), 2000);
                }
                return;
            }

            locations = locations.filter(item => item !== locToDelete);
            if (activeLocation === locToDelete) {
                activeLocation = locations[0];
            }

            saveLocationsToStorage();
            renderLocations();
        }

        function closeResult() {
            const resultBox = document.getElementById('resultBox');
            if (resultBox) resultBox.classList.add('hidden');
        }

        function determineClothing(apparentTemp) {
            if (apparentTemp >= 25) {
                return {
                    jacket: '半袖シャツ',
                    pants: 'ズボン',
                    comment: '日中は汗ばむ陽気となります。通気性の良い半袖シャツと軽快なズボンでお出かけください。'
                };
            } else if (apparentTemp >= 20) {
                return {
                    jacket: '長袖シャツ',
                    pants: 'ズボン',
                    comment: '過ごしやすい快適な気温です。長袖シャツ1枚で心地よくお過ごしいただけます。'
                };
            } else if (apparentTemp >= 16) {
                return {
                    jacket: 'インナーシャツ＋長袖シャツ＋ジャケット',
                    pants: 'ズボン',
                    comment: '朝夕や日陰では肌寒さを感じます。ジャケットを羽織り脱ぎ着しやすい重ね着が最適です。'
                };
            } else if (apparentTemp >= 11) {
                return {
                    jacket: '防寒インナー＋長袖シャツ＋軽防寒服',
                    pants: 'インナー＋ズボン',
                    comment: '空気の冷たさを感じます。防寒インナーと軽防寒服でしっかり保温対策を行いましょう。'
                };
            } else if (apparentTemp >= 6) {
                return {
                    jacket: '防寒インナー＋長袖シャツ＋ジャケット＋軽防寒服',
                    pants: '防寒インナー＋軽防寒ズボン',
                    comment: '真冬のような寒さになります。厚手の防寒インナーとアウターを重ね、下半身も暖かくしてください。'
                };
            } else {
                return {
                    jacket: '防寒インナー＋長袖シャツ＋重防寒服',
                    pants: '防寒インナー＋防寒ズボン',
                    comment: '厳しい冷え込みとなります。ダウン等の重防寒服と防寒ズボンで万全の防寒対策をしてください。'
                };
            }
        }

        // 気象庁エリアコードを取得
        function getAreaCode(locationName) {
            for (const [key, code] of Object.entries(PREFECTURE_CODES)) {
                if (locationName.includes(key)) {
                    return code;
                }
            }
            return '130000'; // 該当なしは東京をデフォルトとする
        }

        // 座標を取得
        function getCoordinates(locationName) {
            for (const [key, coords] of Object.entries(LOCATION_COORDS)) {
                if (locationName.includes(key)) {
                    return coords;
                }
            }
            return { lat: 35.6895, lon: 139.6917 };
        }

        // 設定モーダル
        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            if (modal) {
                modal.classList.toggle('hidden');
            }
        }

        function saveApiKeySettings() {
            toggleSettingsModal();
        }

        async function getRecommendation() {
            const btn = document.getElementById('checkBtn');
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            const forecastSec = document.getElementById('forecastSection');
            const outfitSec = document.getElementById('outfitSection');
            const adviceSec = document.getElementById('adviceSection');
            const errorBox = document.getElementById('errorBox');
            const resultBadge = document.getElementById('resultLocationBadge');
            const resultTitle = document.getElementById('resultMainTitle');

            const targetLocation = activeLocation || '東京都品川区';

            if (resultTitle) resultTitle.innerText = `明日の${targetLocation}の天気`;
            if (resultBadge) resultBadge.innerText = targetLocation;

            btn.disabled = true;
            btn.classList.add('opacity-50', 'pointer-events-none');
            loading.classList.remove('hidden');
            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            try {
                const areaCode = getAreaCode(targetLocation);
                const coords = getCoordinates(targetLocation);

                // 1. 気象庁公式JSON APIの呼び出し (CORSフリー・登録不要)
                const jmaUrl = `https://www.jma.go.jp/bosai/forecast/data/forecast/${areaCode}.json`;
                
                // 2. 風速・体感温度補完用（Open-Meteo気象庁・ECMWF高精度モデル連動）
                const meteoUrl = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,precipitation_probability_max,windspeed_10m_max,winddirection_10m_dominant&timezone=Asia%2FTokyo&forecast_days=3`;

                const [jmaRes, meteoRes] = await Promise.all([
                    fetch(jmaUrl).catch(() => null),
                    fetch(meteoUrl).catch(() => null)
                ]);

                let weatherText = '晴れ';
                let maxTemp = 20;
                let minTemp = 12;
                let apparentTemp = 18;
                let windStr = '北 3m/s';
                let amPop = 10;
                let pmPop = 20;

                // 気象庁公式データの解析
                if (jmaRes && jmaRes.ok) {
                    const jmaData = await jmaRes.json();
                    if (Array.isArray(jmaData) && jmaData.length > 0) {
                        const timeSeries = jmaData[0]?.timeSeries || [];
                        
                        // 天気予報テキスト（明日：インデックス1）
                        const weatherArea = timeSeries[0]?.areas?.[0];
                        if (weatherArea?.weathers && weatherArea.weathers.length > 1) {
                            weatherText = weatherArea.weathers[1].replace(/\s+/g, ' ').trim();
                        } else if (weatherArea?.weathers?.[0]) {
                            weatherText = weatherArea.weathers[0].replace(/\s+/g, ' ').trim();
                        }

                        // 気象庁の降水確率
                        const popArea = timeSeries[1]?.areas?.[0];
                        if (popArea?.pops && popArea.pops.length >= 4) {
                            // 明日の午前・午後を抽出
                            amPop = parseInt(popArea.pops[2] || popArea.pops[0] || '10', 10);
                            pmPop = parseInt(popArea.pops[3] || popArea.pops[1] || '20', 10);
                        }

                        // 気象庁の気温データ
                        const tempArea = timeSeries[2]?.areas?.[0];
                        if (tempArea?.temps && tempArea.temps.length >= 4) {
                            minTemp = parseInt(tempArea.temps[2] || '12', 10);
                            maxTemp = parseInt(tempArea.temps[3] || '20', 10);
                        }
                    }
                }

                // 体感温度と風向風速の算出
                if (meteoRes && meteoRes.ok) {
                    const mData = await meteoRes.json();
                    if (mData.daily) {
                        const tomorrowIndex = 1;
                        if (mData.daily.temperature_2m_max?.[tomorrowIndex] !== undefined) {
                            maxTemp = Math.round(mData.daily.temperature_2m_max[tomorrowIndex]);
                        }
                        if (mData.daily.temperature_2m_min?.[tomorrowIndex] !== undefined) {
                            minTemp = Math.round(mData.daily.temperature_2m_min[tomorrowIndex]);
                        }
                        if (mData.daily.apparent_temperature_max?.[tomorrowIndex] !== undefined) {
                            apparentTemp = Math.round(mData.daily.apparent_temperature_max[tomorrowIndex]);
                        }
                        const windSpeed = (mData.daily.windspeed_10m_max?.[tomorrowIndex] / 3.6).toFixed(1);
                        const windDeg = mData.daily.winddirection_10m_dominant?.[tomorrowIndex] || 0;
                        const directions = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
                        const windDir = directions[Math.round(windDeg / 22.5) % 16] || '北';
                        windStr = `${windDir} ${windSpeed}m/s`;
                    }
                } else {
                    // フォールバック計算
                    apparentTemp = maxTemp - 2;
                }

                // 服装判定
                const clothing = determineClothing(apparentTemp);

                if (forecastSec) {
                    forecastSec.innerHTML = `
                        <div>天気：${escapeHtml(weatherText)}</div>
                        <div>気温：最高 ${maxTemp}℃ / 最低 ${minTemp}℃</div>
                        <div>体感温度：${apparentTemp}℃</div>
                        <div>風：${escapeHtml(windStr)}</div>
                        <div>降水確率：午前 ${amPop}% / 午後 ${pmPop}%</div>
                    `.trim();
                }

                if (outfitSec) {
                    outfitSec.innerHTML = `
                        <div class="mb-1"><span class="text-[#8e8e93] text-sm">上着：</span><span class="text-white">${clothing.jacket}</span></div>
                        <div><span class="text-[#8e8e93] text-sm">ズボン：</span><span class="text-white">${clothing.pants}</span></div>
                    `.trim();
                }

                if (adviceSec) {
                    let umbrella = '';
                    if (amPop >= 40 || pmPop >= 40 || weatherText.includes('雨')) {
                        umbrella = ' 折りたたみ傘などの雨具をお持ちいただくと安心です。';
                    }
                    adviceSec.innerText = clothing.comment + umbrella;
                }

                resultBox.classList.remove('hidden');

            } catch (err) {
                console.error("Forecast Error:", err);
                errorBox.innerText = `データ取得中にエラーが発生しました: ${err.message}
通信状況を確認し、再度お試しください。`;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'pointer-events-none');
                loading.classList.add('hidden');
            }
        }
    </script>
    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
