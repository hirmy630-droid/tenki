<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>明日の服装（ウェザーニュース基準優先版）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif;
            background-color: #000000;
            color: #f5f5f7;
            -webkit-tap-highlight-color: transparent;
            word-break: keep-all;
            overflow-wrap: break-word;
        }

        .safe-area-top {
            padding-top: env(safe-area-inset-top, 16px);
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .text-wrap-optimal {
            word-break: auto-phrase;
            overflow-wrap: anywhere;
            line-break: strict;
        }

        .ios-btn:active {
            transform: scale(0.97);
            filter: brightness(0.85);
        }

        .ios-loader {
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #0a84ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-180.png">
</head>
<body class="min-h-screen bg-black flex flex-col justify-between p-4 safe-area-top safe-area-bottom selection:bg-blue-600 selection:text-white">

    <div class="w-full max-w-sm mx-auto flex-1 flex flex-col justify-start space-y-4">
        
        <!-- iOS Style Header -->
        <header class="pt-2 pb-1 text-center relative">
            <button onclick="toggleSettingsModal()" class="absolute right-0 top-1 text-[#8e8e93] hover:text-white p-2 text-xl" title="APIキー設定（任意）">
                ⚙️
            </button>
            <h1 class="text-[22px] font-bold tracking-tight text-white flex items-center justify-center gap-1.5">
                明日の服装予報
            </h1>
            <p id="headerSubtitle" class="text-[14px] text-[#8e8e93] mt-1 text-wrap-optimal font-normal">
                気象庁公式データ・服装判定連携
            </p>
        </header>

        <!-- Location Input Section -->
        <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-2xl p-3.5 shadow-xl space-y-2.5">
            <div class="flex items-center justify-between px-1">
                <label for="locationInput" class="text-[14px] font-medium text-[#8e8e93] flex items-center gap-1.5">
                    <span>📍</span>
                    <span>登録場所の管理</span>
                </label>
                <span id="saveStatus" class="text-[14px] text-[#30d158] font-medium transition-opacity opacity-0">追加完了</span>
            </div>
            
            <!-- 追加フォーム -->
            <div class="flex items-center gap-2">
                <input 
                    type="text" 
                    id="locationInput" 
                    placeholder="新しい場所（例: 大阪市、横浜市）" 
                    class="flex-1 bg-[#2c2c2e]/70 border border-[#3a3a3c] focus:border-[#0a84ff] text-white text-[14px] rounded-xl px-3 py-2 outline-none transition-colors duration-150 placeholder-[#636366]"
                    onkeydown="if(event.key === 'Enter') handleAddLocation()"
                >
                <button 
                    type="button" 
                    onclick="handleAddLocation()" 
                    class="ios-btn bg-[#0a84ff] hover:bg-[#0071e3] active:scale-95 text-white font-semibold text-[14px] px-3.5 py-2 rounded-xl shrink-0 transition-all flex items-center gap-1">
                    <span>＋ 追加</span>
                </button>
            </div>

            <!-- 登録場所リスト -->
            <div class="pt-0.5">
                <div class="text-[14px] text-[#8e8e93] mb-1.5 px-1 flex items-center justify-between">
                    <span>タップして切り替え：</span>
                    <span id="locationCount" class="text-[14px] text-[#636366]">0件</span>
                </div>
                <!-- 5件までスクロールなしで収まる高さに拡張（6件目からスクロール） -->
                <div id="locationList" class="space-y-1.5 max-h-[235px] overflow-y-auto pr-0.5">
                    <!-- JavaScriptで動的生成 -->
                </div>
            </div>
        </div>

        <!-- Action Section -->
        <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-2xl p-3.5 shadow-2xl backdrop-blur-md">
            <button 
                id="checkBtn" 
                onclick="getRecommendation()" 
                class="ios-btn w-full bg-gradient-to-r from-[#ff9500] to-[#ff5e3a] hover:brightness-110 text-white font-semibold text-[16px] h-12 rounded-xl shadow-lg transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer touch-manipulation">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
                </svg>
                <span>天気予報</span>
            </button>

            <!-- Loading State -->
            <div id="loading" class="hidden py-6 flex flex-col items-center justify-center">
                <div class="ios-loader w-8 h-8 mb-3" style="border-top-color: #ff9500;"></div>
                <p id="loadingText" class="text-[14px] font-medium text-[#8e8e93] text-wrap-optimal animate-pulse text-center">
                    気象データ取得＆体感温度・服装判定中...
                </p>
            </div>
        </div>

        <!-- Fullscreen Result View -->
        <div id="resultBox" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex flex-col safe-area-top safe-area-bottom">
            <!-- Navigation Bar with Back Button & Overview Button -->
            <div class="flex items-center justify-between px-4 py-2.5 border-b border-[#2c2c2e] bg-[#1c1c1e]/80 backdrop-blur-md">
                <button onclick="closeResult()" class="ios-btn flex items-center gap-1 text-[#ff9500] font-semibold text-[16px] py-1 px-1 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
                    </svg>
                    <span>戻る</span>
                </button>
                <div class="flex items-center gap-2">
                    <button onclick="toggleOverviewModal(true)" class="ios-btn bg-[#2c2c2e] hover:bg-[#3a3a3c] text-[#aeaeb2] hover:text-white text-[13px] px-2.5 py-1 rounded-lg border border-[#3a3a3c] flex items-center gap-1 transition-all">
                        <span>📜 概況</span>
                    </button>
                    <span id="resultLocationBadge" class="text-[14px] bg-[#2c2c2e] text-white border border-[#3a3a3c] px-3 py-1 rounded-full font-medium">東京都品川区</span>
                </div>
            </div>

            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-y-auto px-3.5 py-2.5 space-y-2.5 max-w-sm w-full mx-auto">
                <!-- Weather Details Section -->
                <div class="bg-[#1c1c1e] rounded-2xl p-3 border border-[#2c2c2e] shadow-lg space-y-1.5">
                    <div class="flex items-center justify-between border-b border-[#2c2c2e] pb-1.5">
                        <div class="flex items-center gap-1.5">
                            <span id="resultWeatherEmoji" class="text-lg">🌤</span>
                            <span id="forecastHeaderTitle" class="text-[15px] font-bold text-white">予報</span>
                        </div>
                        <div>
                            <span id="forecastApparentBadge" class="text-[14px] bg-orange-500/20 text-orange-400 font-bold px-2 py-0.5 rounded-full border border-orange-500/30">体感 --℃</span>
                        </div>
                    </div>
                    <div id="forecastSection" class="text-[15px] font-medium text-[#d1d1d6] leading-snug space-y-0.5"></div>
                </div>

                <!-- Outfit Section -->
                <div class="bg-[#ff9500]/15 rounded-2xl p-3 border border-[#ff9500]/40 shadow-xl space-y-1.5">
                    <div class="flex items-center justify-between border-b border-[#ff9500]/30 pb-1.5">
                        <div class="flex items-center gap-1.5">
                            <span class="text-base">👔</span>
                            <h3 class="text-[15px] font-bold text-[#ff9500] uppercase tracking-wider">推奨服装</h3>
                        </div>
                        <span id="criteriaBadge" class="text-[14px] text-white/80 font-medium">判定基準：--</span>
                    </div>
                    <div id="outfitSection" class="space-y-1.5"></div>
                </div>

                <!-- Bottom Back Button -->
                <div class="pt-1 pb-4">
                    <button onclick="closeResult()" class="ios-btn w-full bg-[#2c2c2e] hover:bg-[#3a3a3c] text-white font-medium text-[15px] h-10 rounded-xl border border-[#3a3a3c] transition-all flex items-center justify-center">
                        閉じて戻る
                    </button>
                </div>
            </div>
        </div>

        <!-- JMA Overview Popup Modal -->
        <div id="overviewModal" class="hidden fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-3.5">
            <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-2xl p-4 w-full max-w-sm shadow-2xl space-y-2.5 flex flex-col max-h-[80vh]">
                <div class="flex items-center justify-between border-b border-[#2c2c2e] pb-2">
                    <div class="flex items-center gap-1.5">
                        <span class="text-base">📜</span>
                        <h3 id="jmaOverviewTitle" class="text-[15px] font-bold text-white">気象庁 天気概況</h3>
                    </div>
                    <span id="jmaReportTimeBadge" class="text-[13px] text-[#8e8e93] font-mono">--:-- 発表</span>
                </div>
                <div id="jmaOverviewText" class="text-[14px] text-[#d1d1d6] leading-relaxed whitespace-pre-wrap overflow-y-auto pr-1 py-1">
                    気象概況を取得中...
                </div>
                <div class="pt-1">
                    <button onclick="toggleOverviewModal(false)" class="ios-btn w-full bg-[#2c2c2e] hover:bg-[#3a3a3c] text-white font-medium text-[14px] py-2 rounded-xl border border-[#3a3a3c]">
                        閉じる
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings Modal (Optional Gemini API Key) -->
        <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-[#1c1c1e] border border-[#2c2c2e] rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-[17px] font-bold text-white">⚙️ API詳細設定（任意）</h3>
                    <button onclick="toggleSettingsModal()" class="text-[#8e8e93] text-lg">✕</button>
                </div>
                <p class="text-[14px] text-[#8e8e93] leading-relaxed">
                    標準状態で登録不要の気象APIを使用しているため、設定しなくてもiPhoneやWebでそのままご利用いただけます。
                </p>
                <div>
                    <label class="text-[14px] text-[#8e8e93] mb-1 block">Gemini APIキー（AI高度解説用）</label>
                    <input 
                        type="password" 
                        id="userApiKey" 
                        placeholder="AI Studioのキー（空欄でOK）"
                        class="w-full bg-[#2c2c2e] border border-[#3a3a3c] text-white text-[14px] rounded-xl px-3 py-2 outline-none focus:border-[#0a84ff]"
                    >
                </div>
                <div class="flex gap-2">
                    <button onclick="saveApiKeySettings()" class="flex-1 bg-[#0a84ff] text-white py-2 rounded-xl text-[14px] font-semibold">保存する</button>
                    <button onclick="toggleSettingsModal()" class="bg-[#2c2c2e] text-[#aeaeb2] px-4 py-2 rounded-xl text-[14px]">キャンセル</button>
                </div>
            </div>
        </div>

        <!-- Error Card -->
        <div id="errorBox" class="hidden bg-[#2c1517] border border-[#ff453a]/30 rounded-2xl p-4 text-[14px] text-[#ff453a] leading-relaxed text-wrap-optimal">
            <!-- Dynamic error message -->
        </div>

    </div>

    <!-- Minimal Footer -->
    <footer class="text-center py-2">
        <p class="text-[14px] text-[#636366]">気象庁公式データ連携</p>
    </footer>

    <script>
        const STORAGE_KEY_LIST = 'weather_checker_saved_locations_list';
        const STORAGE_KEY_ACTIVE = 'weather_checker_active_location';
        const DEFAULT_LOCATIONS = ['東京都品川区', '横浜市中区', '大阪市北区'];

        // 指定された手持ち服リスト＆体感温度による厳格な判定基準
        function evaluateClothingByCriteria(apparentTemp) {
            let ruleKey = '';
            let label = '';
            let jacket = '';
            let pants = '';

            if (apparentTemp >= 25) {
                ruleKey = 'rule-25';
                label = '25℃以上';
                jacket = '半袖シャツ';
                pants = 'ズボン';
            } else if (apparentTemp >= 20) {
                ruleKey = 'rule-20';
                label = '20℃〜24℃';
                jacket = '長袖シャツ';
                pants = 'ズボン';
            } else if (apparentTemp >= 16) {
                ruleKey = 'rule-16';
                label = '16℃〜20℃';
                jacket = 'インナーシャツ ＋ 長袖シャツ ＋ ジャケット';
                pants = 'ズボン';
            } else if (apparentTemp >= 11) {
                ruleKey = 'rule-11';
                label = '11℃〜15℃';
                jacket = '防寒インナー ＋ 長袖シャツ ＋ 軽防寒服';
                pants = 'インナー ＋ ズボン';
            } else if (apparentTemp >= 6) {
                ruleKey = 'rule-6';
                label = '6℃〜10℃';
                jacket = '防寒インナー ＋ 長袖シャツ ＋ ジャケット ＋ 軽防寒服';
                pants = '防寒インナー ＋ 軽防寒ズボン';
            } else {
                ruleKey = 'rule-5';
                label = '5℃以下';
                jacket = '防寒インナー ＋ 長袖シャツ ＋ 重防寒服';
                pants = '防寒インナー ＋ 防寒ズボン';
            }

            return { ruleKey, label, jacket, pants };
        }

        // 気象庁(JMA) 府県予報区コードマッピング (主要地域)
        const PREFECTURE_CODES = {
            '東京': '130000', '品川': '130000', '新宿': '130000', '渋谷': '130000', '千代田': '130000',
            '神奈川': '140000', '横浜': '140000', '川崎': '140000',
            '大阪': '270000', '北区': '270000', '梅田': '270000', '難波': '270000',
            '愛知': '230000', '名古屋': '230000',
            '北海道': '016000', '札幌': '016000',
            '福岡': '400000', '博多': '400000',
            '京都': '260000', '兵庫': '280000', '神戸': '280000',
            '宮城': '040000', '仙台': '040000',
            '広島': '340000', '沖縄': '471000', '那覇': '471000',
            '千葉': '120000', '埼玉': '110000', '茨城': '080000', '栃木': '090000', '群馬': '100000',
            '静岡': '220000', '新潟': '150000', '長野': '200000', '熊本': '430000'
        };

        // 主要地点の緯度経度（高解像度気象データ計算用）
        const LOCATION_COORDS = {
            '東京': { lat: 35.6895, lon: 139.6917 },
            '品川': { lat: 35.6092, lon: 139.7302 },
            '横浜': { lat: 35.4437, lon: 139.6380 },
            '大阪': { lat: 34.6937, lon: 135.5023 },
            '名古屋': { lat: 35.1815, lon: 136.9066 },
            '札幌': { lat: 43.0618, lon: 141.3545 },
            '福岡': { lat: 33.5904, lon: 130.4017 },
            '京都': { lat: 35.0116, lon: 135.7681 },
            '神戸': { lat: 34.6901, lon: 135.1955 }
        };

        let locations = [];
        let activeLocation = '東京都品川区';

        window.addEventListener('DOMContentLoaded', () => {
            loadLocations();
            renderLocations();
        });

        function loadLocations() {
            const savedListJson = localStorage.getItem(STORAGE_KEY_LIST);
            if (savedListJson) {
                try {
                    locations = JSON.parse(savedListJson);
                } catch (e) {
                    locations = [...DEFAULT_LOCATIONS];
                }
            } else {
                locations = [...DEFAULT_LOCATIONS];
                saveLocationsToStorage();
            }

            if (!Array.isArray(locations) || locations.length === 0) {
                locations = ['東京都品川区'];
            }

            const savedActive = localStorage.getItem(STORAGE_KEY_ACTIVE);
            if (savedActive && locations.includes(savedActive)) {
                activeLocation = savedActive;
            } else {
                activeLocation = locations[0];
                localStorage.setItem(STORAGE_KEY_ACTIVE, activeLocation);
            }
        }

        function saveLocationsToStorage() {
            localStorage.setItem(STORAGE_KEY_LIST, JSON.stringify(locations));
            localStorage.setItem(STORAGE_KEY_ACTIVE, activeLocation);
        }

        function renderLocations() {
            const listEl = document.getElementById('locationList');
            const countEl = document.getElementById('locationCount');
            if (!listEl) return;

            if (countEl) countEl.innerText = `${locations.length}件登録中`;

            listEl.innerHTML = '';
            locations.forEach((loc) => {
                const isActive = (loc === activeLocation);
                
                const item = document.createElement('div');
                item.className = `flex items-center justify-between px-3 py-2 rounded-xl border transition-all ${
                    isActive 
                        ? 'bg-[#ff9500]/20 border-[#ff9500]/70 text-white shadow-sm' 
                        : 'bg-[#2c2c2e]/60 border-[#3a3a3c] text-[#aeaeb2] hover:bg-[#2c2c2e]'
                }`;

                const textBtn = document.createElement('button');
                textBtn.type = 'button';
                textBtn.className = 'flex-1 text-left flex items-center gap-2 text-[14px] font-medium outline-none truncate';
                textBtn.innerHTML = `
                    <span class="${isActive ? 'text-[#ff9500]' : 'text-transparent'} text-[14px] select-none">✓</span>
                    <span class="truncate ${isActive ? 'font-semibold text-white' : ''}">${escapeHtml(loc)}</span>
                `;
                textBtn.onclick = () => selectLocation(loc);

                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'ios-btn text-[#8e8e93] hover:text-[#ff453a] active:text-[#ff453a] p-1.5 ml-2 rounded-lg text-[14px] transition-colors';
                delBtn.setAttribute('aria-label', `${loc}を削除`);
                delBtn.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                `;
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    handleDeleteLocation(loc);
                };

                item.appendChild(textBtn);
                item.appendChild(delBtn);
                listEl.appendChild(item);
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function selectLocation(loc) {
            activeLocation = loc;
            saveLocationsToStorage();
            renderLocations();
        }

        function handleAddLocation() {
            const input = document.getElementById('locationInput');
            const status = document.getElementById('saveStatus');
            const val = input?.value.trim();

            if (!val) return;

            if (!locations.includes(val)) {
                locations.unshift(val);
                activeLocation = val;
                saveLocationsToStorage();
                renderLocations();

                if (status) {
                    status.innerText = '追加完了';
                    status.classList.remove('opacity-0');
                    setTimeout(() => status.classList.add('opacity-0'), 1800);
                }
            } else {
                selectLocation(val);
            }

            if (input) input.value = '';
        }

        function handleDeleteLocation(locToDelete) {
            if (locations.length <= 1) {
                const status = document.getElementById('saveStatus');
                if (status) {
                    status.innerText = '最後の1件は削除できません';
                    status.classList.remove('opacity-0');
                    setTimeout(() => status.classList.add('opacity-0'), 2000);
                }
                return;
            }

            locations = locations.filter(item => item !== locToDelete);
            if (activeLocation === locToDelete) {
                activeLocation = locations[0];
            }

            saveLocationsToStorage();
            renderLocations();
        }

        function closeResult() {
            const resultBox = document.getElementById('resultBox');
            if (resultBox) resultBox.classList.add('hidden');
        }

        function toggleOverviewModal(show) {
            const modal = document.getElementById('overviewModal');
            if (!modal) return;
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function getAreaCode(locationName) {
            for (const [key, code] of Object.entries(PREFECTURE_CODES)) {
                if (locationName.includes(key)) {
                    return code;
                }
            }
            return '130000';
        }

        function getCoordinates(locationName) {
            for (const [key, coords] of Object.entries(LOCATION_COORDS)) {
                if (locationName.includes(key)) {
                    return coords;
                }
            }
            return { lat: 35.6895, lon: 139.6917 };
        }

        async function getRecommendation() {
            const btn = document.getElementById('checkBtn');
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            const forecastSec = document.getElementById('forecastSection');
            const outfitSec = document.getElementById('outfitSection');
            const criteriaBadge = document.getElementById('criteriaBadge');
            const forecastApparentBadge = document.getElementById('forecastApparentBadge');
            const errorBox = document.getElementById('errorBox');
            const resultBadge = document.getElementById('resultLocationBadge');
            const emojiEl = document.getElementById('resultWeatherEmoji');
            const jmaOverviewTitle = document.getElementById('jmaOverviewTitle');
            const jmaReportTimeBadge = document.getElementById('jmaReportTimeBadge');
            const jmaOverviewText = document.getElementById('jmaOverviewText');

            const targetLocation = activeLocation || '東京都品川区';

            if (resultBadge) resultBadge.innerText = targetLocation;

            btn.disabled = true;
            btn.classList.add('opacity-50', 'pointer-events-none');
            loading.classList.remove('hidden');
            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            try {
                const areaCode = getAreaCode(targetLocation);
                const coords = getCoordinates(targetLocation);

                const jmaForecastUrl = `https://www.jma.go.jp/bosai/forecast/data/forecast/${areaCode}.json`;
                const jmaOverviewUrl = `https://www.jma.go.jp/bosai/forecast/data/overview_forecast/${areaCode}.json`;
                const meteoUrl = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=apparent_temperature_max,windspeed_10m_max&timezone=Asia%2FTokyo&forecast_days=3`;

                const [jmaForecastRes, jmaOverviewRes, meteoRes] = await Promise.all([
                    fetch(jmaForecastUrl).catch(() => null),
                    fetch(jmaOverviewUrl).catch(() => null),
                    fetch(meteoUrl).catch(() => null)
                ]);

                let weatherText = '曇り';
                let windText = '北の風';
                let maxTemp = null;
                let minTemp = null;
                let popList = [];
                let targetDateLabel = '明日';
                let apparentTemp = null;
                let windSpeedVal = 2.5;

                // 1. 気象庁公式の天気予報
                if (jmaForecastRes && jmaForecastRes.ok) {
                    const jmaData = await jmaForecastRes.json();
                    if (Array.isArray(jmaData) && jmaData.length > 0) {
                        const weatherSeries = jmaData[0]?.timeSeries?.[0];
                        const area = weatherSeries?.areas?.[0];
                        const timeDefines = weatherSeries?.timeDefines || [];

                        let targetIdx = 1;
                        if (timeDefines.length <= 1) {
                            targetIdx = 0;
                        }

                        if (timeDefines[targetIdx]) {
                            const d = new Date(timeDefines[targetIdx]);
                            const days = ['日', '月', '火', '水', '木', '金', '土'];
                            targetDateLabel = `${d.getDate()}日(${days[d.getDay()]})`;
                        }

                        if (area?.weathers?.[targetIdx]) {
                            weatherText = area.weathers[targetIdx].replace(/\s+/g, ' ').trim();
                        }
                        if (area?.winds?.[targetIdx]) {
                            windText = area.winds[targetIdx].replace(/\s+/g, ' ').trim();
                        }

                        // 降水確率
                        const popSeries = jmaData[0]?.timeSeries?.[1];
                        const popArea = popSeries?.areas?.[0];
                        const popDefines = popSeries?.timeDefines || [];
                        const targetDateStr = timeDefines[targetIdx] ? timeDefines[targetIdx].slice(0, 10) : '';

                        if (popArea?.pops) {
                            popDefines.forEach((t, idx) => {
                                if (t.startsWith(targetDateStr) && popArea.pops[idx] !== undefined) {
                                    popList.push(`${popArea.pops[idx]}%`);
                                }
                            });
                            if (popList.length === 0) {
                                popList = popArea.pops.slice(-4).map(p => `${p}%`);
                            }
                        }

                        // 気温
                        const tempSeries = jmaData[0]?.timeSeries?.[2];
                        const tempArea = tempSeries?.areas?.[0];
                        const tempDefines = tempSeries?.timeDefines || [];
                        const tempVals = tempArea?.temps || [];

                        tempDefines.forEach((t, idx) => {
                            if (t.startsWith(targetDateStr) && tempVals[idx] !== undefined) {
                                const val = parseInt(tempVals[idx], 10);
                                if (minTemp === null || val < minTemp) minTemp = val;
                                if (maxTemp === null || val > maxTemp) maxTemp = val;
                            }
                        });

                        if (jmaData[1]?.timeSeries?.[1]) {
                            const weekArea = jmaData[1].timeSeries[1].areas?.[0];
                            const weekDefines = jmaData[1].timeSeries[1].timeDefines || [];
                            const weekIdx = weekDefines.findIndex(t => t.startsWith(targetDateStr));
                            if (weekIdx !== -1 && weekArea) {
                                if (weekArea.tempsMin?.[weekIdx]) minTemp = parseInt(weekArea.tempsMin[weekIdx], 10);
                                if (weekArea.tempsMax?.[weekIdx]) maxTemp = parseInt(weekArea.tempsMax[weekIdx], 10);
                            }
                        }
                    }
                }

                // 2. 気象庁公式「天気概況」
                let overviewReportTime = '';
                let overviewTarget = '';
                let overviewBody = '気象庁の概況文を取得できませんでした。';

                if (jmaOverviewRes && jmaOverviewRes.ok) {
                    const overviewData = await jmaOverviewRes.json();
                    if (overviewData) {
                        overviewTarget = overviewData.targetArea || '';
                        if (overviewData.reportDatetime) {
                            const d = new Date(overviewData.reportDatetime);
                            overviewReportTime = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} 発表`;
                        }
                        if (overviewData.text) {
                            overviewBody = overviewData.text.trim();
                        }
                    }
                }

                // 3. 体感温度補正
                if (meteoRes && meteoRes.ok) {
                    const mData = await meteoRes.json();
                    if (mData.daily?.apparent_temperature_max?.[1] !== undefined) {
                        apparentTemp = Math.round(mData.daily.apparent_temperature_max[1]);
                    }
                    if (mData.daily?.windspeed_10m_max?.[1] !== undefined) {
                        windSpeedVal = parseFloat((mData.daily.windspeed_10m_max[1] / 3.6).toFixed(1));
                    }
                }
                if (maxTemp === null) maxTemp = 22;
                if (minTemp === null) minTemp = 20;
                if (apparentTemp === null) apparentTemp = maxTemp - 1;

                if (weatherText.includes('雨')) {
                    emojiEl.innerText = '🌧';
                } else if (weatherText.includes('雪')) {
                    emojiEl.innerText = '❄️';
                } else if (weatherText.includes('曇')) {
                    emojiEl.innerText = '☁️';
                } else {
                    emojiEl.innerText = '☀️';
                }

                // 服装判定
                const result = evaluateClothingByCriteria(apparentTemp);

                // UI反映: 予報カード
                const forecastHeaderTitle = document.getElementById('forecastHeaderTitle');
                if (forecastHeaderTitle) forecastHeaderTitle.innerText = `予報【${targetDateLabel}】`;
                if (forecastApparentBadge) forecastApparentBadge.innerText = `体感 ${apparentTemp}℃`;

                const popDisplay = popList.length > 0 ? popList.join(' / ') : '--%';

                if (forecastSec) {
                    forecastSec.innerHTML = `
                        <div class="flex justify-between py-0.5 border-b border-[#2c2c2e]/60">
                            <span class="text-[#8e8e93] shrink-0">天気</span>
                            <span class="text-white font-semibold text-right">${escapeHtml(weatherText)}</span>
                        </div>
                        <div class="flex justify-between py-0.5 border-b border-[#2c2c2e]/60">
                            <span class="text-[#8e8e93]">風の予報</span>
                            <span class="text-white font-medium text-right text-[14px]">${escapeHtml(windText)}</span>
                        </div>
                        <div class="flex justify-between py-0.5 border-b border-[#2c2c2e]/60">
                            <span class="text-[#8e8e93]">気温（最低 / 最高）</span>
                            <span class="text-white font-mono font-bold">${minTemp}℃ / ${maxTemp}℃</span>
                        </div>
                        <div class="flex justify-between py-0.5 border-b border-[#2c2c2e]/60">
                            <span class="text-[#8e8e93]">降水確率</span>
                            <span class="text-white font-mono">${popDisplay}</span>
                        </div>
                        <div class="flex justify-between py-0.5">
                            <span class="text-[#8e8e93]">日中体感温度</span>
                            <span class="text-orange-400 font-bold">${apparentTemp}℃</span>
                        </div>
                    `;
                }

                // UI反映: 気象庁 天気概況
                if (jmaOverviewTitle) jmaOverviewTitle.innerText = `天気概況（${overviewTarget || targetLocation}）`;
                if (jmaReportTimeBadge) jmaReportTimeBadge.innerText = overviewReportTime || '公式発表';
                if (jmaOverviewText) jmaOverviewText.innerText = overviewBody;

                // UI反映: 推奨服装
                if (criteriaBadge) criteriaBadge.innerText = `判定基準：${result.label}`;
                if (outfitSec) {
                    outfitSec.innerHTML = `
                        <div class="bg-[#1c1c1e]/80 rounded-xl p-2.5 border border-[#ff9500]/30">
                            <div class="text-[14px] font-bold text-[#ff9500] uppercase tracking-wider mb-0.5">【上着】</div>
                            <div class="text-white font-semibold text-[15px] leading-tight">${escapeHtml(result.jacket)}</div>
                        </div>
                        <div class="bg-[#1c1c1e]/80 rounded-xl p-2.5 border border-[#ff9500]/30">
                            <div class="text-[14px] font-bold text-[#ff9500] uppercase tracking-wider mb-0.5">【ズボン】</div>
                            <div class="text-white font-semibold text-[15px] leading-tight">${escapeHtml(result.pants)}</div>
                        </div>
                    `;
                }

                resultBox.classList.remove('hidden');

            } catch (err) {
                console.error("Forecast Error:", err);
                errorBox.innerText = `データ取得中にエラーが発生しました: ${err.message}`;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'pointer-events-none');
                loading.classList.add('hidden');
            }
        }
    </script>
    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
